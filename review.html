function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function deriveKey(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}

  //   トップレベルで宣言しているため、素のまま2回実行すると
  //   「Identifier 'DATA' has already been declared」で**ページが壊れる**。
  //   （保存キーがある状態でキーを入れ直す等、2回目の解錠は普通に起こる）
  root.querySelectorAll('script').forEach(function(old){
    const s = document.createElement('script');
    // 改行文字のエスケープをここに書かないこと（生成経路で実改行に化けて壊れる）。
    s.textContent = '(function(){' + old.textContent + '})();';
    old.parentNode.replaceChild(s, old);
  });
}
let unlocked = false;
async function tryOpen(pass){
  if(unlocked) return true;          // 二重解錠を防ぐ（描画は1回だけ）
  try{
    const key = await deriveKey(pass, b64(PAYLOAD.salt));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
    const app = document.getElementById('app');
    app.innerHTML = new TextDecoder().decode(pt);
    runScripts(app);
    unlocked = true;
    document.getElementById('gate').style.display = 'none';
    try{ localStorage.setItem('kp_review_key', pass); }catch(e){}
    return true;
  }catch(e){ return false; }
}
async function manual(){
  const btn = document.querySelector('#gate button');
  const err = document.getElementById('gerr');
  err.textContent = '確認中…'; btn.disabled = true;
  const ok = await tryOpen(document.getElementById('pw').value.trim());
  btn.disabled = false;
  if(!ok) err.textContent = 'キーが違います';
}
(async function boot(){
  const u = new URL(location.href);
  const qk = u.searchParams.get('key');
  if(qk){ u.searchParams.delete('key'); history.replaceState(null, '', u.toString()); }
  let saved = null;
  try{ saved = localStorage.getItem('kp_review_key'); }catch(e){}
  for(const k of [qk, saved]){
    if(k && await tryOpen(k)) return;
  }
  document.getElementById('gate').style.display = 'flex';
})();
